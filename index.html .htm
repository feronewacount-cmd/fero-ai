<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="FERO AI: asisten AI untuk ngoding, belajar, PR sekolah, dan informasi umum.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FERO AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>FERO AI</title>
<style>
:root{
  --bg:#000000;
  --surface:#111116;
  --surface2:#1a1a22;
  --line:#26262f;
  --text:#ecedf3;
  --muted:#8b8d9c;
  --blue:#1f6fff;
  --blue-press:#1859d1;
  --danger:#ff5d5d;
  --code:#0b0b10;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center;
  font-weight:800;font-size:18px;color:#fff;letter-spacing:-1px}
.brand b{font-size:18px;letter-spacing:.5px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.hbtns{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
.ghost:active{background:var(--surface)}

.modes{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:22px;width:100%;max-width:820px;align-self:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overscroll-behavior:contain}
.msg{overflow-wrap:anywhere;min-width:0}
.msg.user{align-self:flex-end;max-width:85%;background:var(--surface2);color:var(--text);
  padding:10px 16px;border-radius:20px 20px 6px 20px;white-space:pre-wrap}
.msg.ai{align-self:stretch;display:flex;gap:12px;align-items:flex-start;padding:0;background:none;border:0}
.msg.ai .av{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:14px;margin-top:1px}
.msg.ai .body{flex:1;min-width:0;padding-top:2px;font-size:16px;line-height:1.65}
.msg.err{align-self:stretch;background:#2a1212;border:1px solid #5a2020;color:#ffb4b4;padding:10px 14px;border-radius:14px}
.msg p{margin:0 0 .6em}.msg p:last-child{margin:0}
.msg ul,.msg ol{margin:.2em 0 .6em;padding-left:1.3em}
.msg code{background:var(--code);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font:13.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.codewrap{margin:.5em 0;border:1px solid var(--line);border-radius:10px;background:var(--code);overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
  border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.copy{background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:12px;color:var(--text)}
.copy:active{background:var(--surface2)}
.codewrap pre{margin:0;padding:10px 12px;overflow-x:auto}
.codewrap pre code{background:none;border:0;padding:0;white-space:pre}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}

.hello{margin:auto;text-align:center;max-width:420px;padding:12px}
.hello h1{margin:0 0 6px;font-size:28px;letter-spacing:.5px}
.hello p{margin:0 0 16px;color:var(--muted)}
.sugs{display:flex;flex-direction:column;gap:8px}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;text-align:left;font-size:15px}
.sug:active{background:var(--surface2)}

form#f{display:flex;gap:10px;align-items:flex-end;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
textarea#q{flex:1;min-width:0;resize:none;max-height:140px;background:var(--surface);color:var(--text);
  border:1px solid var(--line);border-radius:24px;padding:12px 18px;font:inherit;line-height:1.4}
textarea#q::placeholder{color:var(--muted)}
#send{flex:0 0 auto;width:46px;height:46px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
#send:active{background:var(--blue-press)}
#send:disabled{opacity:.45}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.panel{width:min(520px,100%);max-height:92%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.sheet{align-items:center}.panel{border-radius:18px}}
.panel h2{margin:0 0 4px;font-size:20px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:14px}
.panel ol{margin:0 0 14px;padding-left:1.2em;color:var(--muted);font-size:14px}
.panel a{color:#6aa3ff}
label{display:block;margin:12px 0 5px;font-size:13px;color:var(--muted)}
input[type=password],input[type=text],select{width:100%;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;background:var(--blue);color:#fff;font-weight:600}
.btn:active{background:var(--blue-press)}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.dng{background:transparent;border:1px solid #5a2020;color:var(--danger);font-weight:500}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--blue)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">F</div>
    <div><b>FERO AI</b><small id="modeLabel">Ngobrol apa saja</small></div>
  </div>
  <div class="hbtns">
    <button class="ghost" id="newChat" type="button">Baru</button>
    <button class="ghost" id="openSet" type="button">Pengaturan</button>
  </div>
</header>

<nav class="modes" id="modes" aria-label="Pilih mode"></nav>

<main id="chat" aria-live="polite"></main>

<form id="f" autocomplete="off">
  <textarea id="q" rows="1" placeholder="Tanya FERO AI apa saja..." aria-label="Pesan"></textarea>
  <button id="send" type="submit" aria-label="Kirim">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
  </button>
</form>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Pengaturan</h2>
    <p>FERO AI memakai Gemini API milik Google. Kuncinya gratis dan hanya tersimpan di browser HP kamu.</p>
    <ol>
      <li>Buka <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></li>
      <li>Login Google, tekan <b>Create API key</b></li>
      <li>Salin kuncinya, tempel di bawah</li>
    </ol>
    <label for="key">API key Gemini</label>
    <input id="key" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
    <label for="model">Model</label>
    <input id="model" type="text" spellcheck="false" autocapitalize="off">
    <div class="check"><input type="checkbox" id="web"><label for="web" style="margin:0;color:var(--text)">Cari di Google saat mode Info Umum (lebih lambat)</label></div>
    <div class="row">
      <button class="btn sec" id="closeSet" type="button">Tutup</button>
      <button class="btn" id="saveSet" type="button">Simpan</button>
    </div>
    <div class="row"><button class="btn dng" id="wipe" type="button">Hapus semua riwayat chat</button></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var MODES = {
    bebas: {
      name: "Bebas",
      label: "Ngobrol apa saja",
      sugs: ["Kasih aku fakta random yang bikin kaget", "Aku lagi bosan, ajak ngobrol dong", "Rekomendasi film atau game seru buat akhir pekan"],
      sys: "Kamu FERO AI, teman ngobrol dan asisten serba bisa. Kamu bisa membahas topik apa saja: ngobrol santai, curhat, humor, ngoding, belajar, PR sekolah, dan informasi umum. Jawab dalam bahasa Indonesia yang santai, hangat, dan natural seperti teman, tapi tetap jelas dan akurat. Sesuaikan panjang jawaban: singkat untuk obrolan ringan, lebih rinci untuk pertanyaan serius. Untuk kode, pakai blok kode. Kalau tidak yakin, katakan terus terang."
    },
    kode: {
      name: "Ngoding",
      label: "Asisten ngoding",
      sugs: ["Jelaskan perbedaan let, const, dan var di JavaScript", "Buatkan program Python kalkulator sederhana", "Kenapa kode saya error? (saya tempel kodenya)"],
      sys: "Kamu FERO AI, asisten ngoding yang sabar dan jelas. Jawab dalam bahasa Indonesia santai tapi sopan. Beri contoh kode lengkap dalam blok kode dengan nama bahasanya, lalu jelaskan baris pentingnya singkat. Kalau ada error, cari penyebabnya dulu, baru beri perbaikan. Untuk pemula, pakai istilah sederhana."
    },
    belajar: {
      name: "Belajar",
      label: "Teman belajar",
      sugs: ["Ajari aku konsep turunan dari nol", "Buatkan 5 soal latihan tentang fotosintesis", "Jelaskan seperti ke anak SMP: apa itu inflasi"],
      sys: "Kamu FERO AI, guru privat yang sabar. Jawab dalam bahasa Indonesia yang mudah dipahami. Jelaskan langkah demi langkah, beri contoh nyata dan analogi sehari-hari. Di akhir penjelasan, beri 1 pertanyaan singkat untuk mengecek pemahaman. Kalau diminta soal latihan, beri kunci jawaban di bagian akhir."
    },
    pr: {
      name: "PR Sekolah",
      label: "Bantu PR sekolah",
      sugs: ["Bantu aku mengerjakan soal matematika ini (aku tulis soalnya)", "Buatkan kerangka esai tentang pentingnya literasi", "Koreksi paragraf tugas Bahasa Indonesia-ku"],
      sys: "Kamu FERO AI, pembimbing PR sekolah. Jawab dalam bahasa Indonesia. Tunjukkan cara mengerjakan langkah demi langkah supaya siswa paham, bukan hanya memberi jawaban akhir. Untuk soal hitungan, tulis rumus dan proses lengkap. Untuk tugas menulis, bantu dengan kerangka, ide, dan koreksi, dan dorong siswa menulis dengan kata-katanya sendiri."
    },
    info: {
      name: "Info Umum",
      label: "Cari informasi",
      sugs: ["Apa berita teknologi terbaru hari ini?", "Jelaskan singkat sejarah kemerdekaan Indonesia", "Bagaimana cara kerja internet?"],
      sys: "Kamu FERO AI, asisten informasi umum. Jawab dalam bahasa Indonesia, ringkas, akurat, dan mudah dipindai. Awali dengan jawaban inti. Kalau tidak yakin atau informasinya bisa sudah berubah, katakan terus terang. Untuk topik kesehatan, hukum, atau keuangan, beri informasi umum dan sarankan bertanya ke ahlinya."
    }
  };

  var $ = function(id){ return document.getElementById(id); };
  var chat = $("chat"), q = $("q"), sendBtn = $("send"), sheet = $("sheet");

  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var state = {
    mode: load("fero_mode_v2", "bebas"),
    key: load("fero_key", ""),
    model: load("fero_model_v2", "gemini-3.5-flash-lite"),
    web: load("fero_web", "1") === "1",
    hist: {}
  };
  if (!MODES[state.mode]) state.mode = "bebas";
  try { state.hist = JSON.parse(load("fero_hist", "{}")) || {}; } catch(e){ state.hist = {}; }
  Object.keys(MODES).forEach(function(m){ if (!Array.isArray(state.hist[m])) state.hist[m] = []; });

  function persist(){ save("fero_hist", JSON.stringify(state.hist)); }

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, "$1<i>$2</i>");
    return s;
  }

  function render(text){
    var out = [], parts = text.split(/```/);
    parts.forEach(function(part, i){
      if (i % 2 === 1){
        var nl = part.indexOf("\n"), lang = "", body = part;
        if (nl > -1){ lang = part.slice(0, nl).trim(); body = part.slice(nl + 1); }
        body = body.replace(/\n$/, "");
        out.push('<div class="codewrap"><div class="codebar"><span>' + esc(lang || "kode") +
          '</span><button type="button" class="copy">Salin</button></div><pre><code>' + esc(body) + '</code></pre></div>');
        return;
      }
      var lines = part.split("\n"), html = "", list = null, para = [];
      function flushP(){ if (para.length){ html += "<p>" + para.join("<br>") + "</p>"; para = []; } }
      function flushL(){ if (list){ html += "</" + list + ">"; list = null; } }
      lines.forEach(function(raw){
        var line = raw.replace(/\s+$/, "");
        var h = line.match(/^#{1,6}\s+(.*)$/);
        var ul = line.match(/^\s*[-*•]\s+(.*)$/);
        var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
        if (!line){ flushP(); flushL(); return; }
        if (h){ flushP(); flushL(); html += "<p><b>" + inline(h[1]) + "</b></p>"; return; }
        if (ul || ol){
          flushP();
          var t = ul ? "ul" : "ol";
          if (list !== t){ flushL(); html += "<" + t + ">"; list = t; }
          html += "<li>" + inline((ul || ol)[1]) + "</li>";
          return;
        }
        flushL(); para.push(inline(line));
      });
      flushP(); flushL();
      out.push(html);
    });
    return out.join("");
  }

  function addMsg(role, text){
    var d = document.createElement("div");
    d.className = "msg " + role;
    if (role === "ai") d.innerHTML = '<div class="av">F</div><div class="body">' + render(text) + '</div>';
    else d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function showHello(){
    var m = MODES[state.mode];
    var w = document.createElement("div");
    w.className = "hello";
    w.innerHTML = "<h1>FERO AI</h1><p>Mode " + esc(m.name) + ". Pilih contoh di bawah atau tulis pertanyaanmu.</p>";
    var box = document.createElement("div");
    box.className = "sugs";
    m.sugs.forEach(function(s){
      var b = document.createElement("button");
      b.type = "button"; b.className = "sug"; b.textContent = s;
      b.addEventListener("click", function(){ q.value = s; q.focus(); grow(); });
      box.appendChild(b);
    });
    w.appendChild(box);
    chat.appendChild(w);
  }

  function draw(){
    chat.innerHTML = "";
    $("modeLabel").textContent = MODES[state.mode].label;
    var h = state.hist[state.mode];
    if (!h.length) showHello();
    h.forEach(function(t){ addMsg(t.role === "user" ? "user" : "ai", t.text); });
    chat.scrollTop = chat.scrollHeight;
    Array.prototype.forEach.call($("modes").children, function(b){
      b.setAttribute("aria-pressed", b.dataset.m === state.mode ? "true" : "false");
    });
  }

  Object.keys(MODES).forEach(function(k){
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.m = k; b.textContent = MODES[k].name;
    b.addEventListener("click", function(){
      if (busy) return;
      state.mode = k; save("fero_mode_v2", k); draw();
    });
    $("modes").appendChild(b);
  });

  function grow(){ q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; }
  q.addEventListener("input", grow);

  chat.addEventListener("click", function(e){
    var t = e.target;
    if (!t.classList || !t.classList.contains("copy")) return;
    var code = t.closest(".codewrap").querySelector("code").textContent;
    function done(){ t.textContent = "Tersalin"; setTimeout(function(){ t.textContent = "Salin"; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(done, function(){ t.textContent = "Gagal"; });
    } else { t.textContent = "Gagal"; }
  });

  var busy = false;

  function buildBody(mode, useSearch){
    var contents = state.hist[mode].map(function(t){
      return { role: t.role === "user" ? "user" : "model", parts: [{ text: t.text }] };
    });
    var body = {
      systemInstruction: { parts: [{ text: MODES[mode].sys }] },
      contents: contents
    };
    if (useSearch) body.tools = [{ google_search: {} }];
    return body;
  }

  function callGemini(mode, useSearch, model){
    var url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse";
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": state.key },
      body: JSON.stringify(buildBody(mode, useSearch))
    }).then(function(r){
      if (r.ok) return { ok: true, status: r.status, r: r };
      return r.json().catch(function(){ return {}; }).then(function(j){ return { ok: false, status: r.status, j: j }; });
    });
  }

  // Baca jawaban sedikit demi sedikit supaya teks langsung muncul.
  function readStream(r, onText){
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = "", full = "", block = "";
    function pump(){
      return reader.read().then(function(x){
        if (x.done) return { text: full, block: block };
        buf += dec.decode(x.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();
        lines.forEach(function(line){
          line = line.trim();
          if (line.indexOf("data:") !== 0) return;
          var payload = line.slice(5).trim();
          if (!payload) return;
          try {
            var j = JSON.parse(payload);
            var c = j.candidates && j.candidates[0];
            if (c && c.content && c.content.parts) c.content.parts.forEach(function(p){ if (p.text && !p.thought) full += p.text; });
            if (j.promptFeedback && j.promptFeedback.blockReason) block = j.promptFeedback.blockReason;
          } catch (e) {}
        });
        if (full) onText(full);
        return pump();
      });
    }
    return pump();
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // Coba model pilihan dulu, ulangi bila server sibuk, lalu pindah ke model cadangan.
  function tryModels(mode, useSearch){
    var list = [state.model, "gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-flash-latest"].filter(function(m, i, a){ return m && a.indexOf(m) === i; });
    var last = null;
    function attempt(mi, n){
      if (mi >= list.length) return Promise.resolve(last);
      return callGemini(mode, useSearch, list[mi]).then(function(res){
        last = res;
        if (res.ok) return res;
        var busyErr = res.status >= 500 || res.status === 429;
        if (!busyErr) return (res.status === 404 && mi + 1 < list.length) ? attempt(mi + 1, 0) : res;
        if (res.status >= 500 && n < 1) return sleep(1500).then(function(){ return attempt(mi, n + 1); });
        return attempt(mi + 1, 0);
      });
    }
    return attempt(0, 0);
  }

  function errText(res){
    var m = (res.j && res.j.error && res.j.error.message) || "";
    if (res.status === 400 && /API key/i.test(m)) return "API key tidak valid. Buka Pengaturan dan periksa kuncinya.";
    if (res.status === 401 || res.status === 403) return "Kuncinya ditolak. Pastikan API key Gemini benar dan aktif.";
    if (res.status === 404) return "Model \"" + state.model + "\" tidak ditemukan. Buka Pengaturan dan ganti nama modelnya.";
    if (res.status === 429) return "Batas pemakaian gratis sedang penuh. Tunggu satu menit lalu coba lagi.";
    if (res.status >= 500) return "Server Google sedang sibuk. FERO sudah mencoba beberapa model. Tunggu 1-2 menit lalu kirim lagi (pesanmu sudah dikembalikan ke kotak ketik).";
    return "Terjadi masalah (" + res.status + "). " + m;
  }

  function send(text){
    var mode = state.mode;
    state.hist[mode].push({ role: "user", text: text });
    persist();
    var first = chat.querySelector(".hello");
    if (first) first.remove();
    addMsg("user", text);
    var wait = document.createElement("div");
    wait.className = "msg ai";
    wait.innerHTML = '<div class="av">F</div><div class="body"><span class="dots"><i></i><i></i><i></i></span></div>';
    chat.appendChild(wait);
    chat.scrollTop = chat.scrollHeight;
    busy = true; sendBtn.disabled = true;

    var wantSearch = mode === "info" && state.web;
    tryModels(mode, wantSearch).then(function(res){
      if (!res.ok && wantSearch && res.status !== 401 && res.status !== 403){
        return tryModels(mode, false);
      }
      return res;
    }).then(function(res){
      if (!res.ok){
        wait.remove();
        state.hist[mode].pop(); persist();
        var d = addMsg("err", errText(res));
        d.className = "msg err";
        q.value = text; grow();
        return;
      }
      var body = wait.querySelector(".body");
      return readStream(res.r, function(t){
        body.innerHTML = render(t);
        chat.scrollTop = chat.scrollHeight;
      }).then(function(out){
        var ans = out.text;
        if (!ans){
          ans = out.block ? "Pesan ini tidak bisa dijawab (" + out.block + "). Coba ubah pertanyaannya." : "Jawabannya kosong. Coba kirim ulang pertanyaannya.";
          body.innerHTML = render(ans);
        }
        state.hist[mode].push({ role: "model", text: ans });
        persist();
      });
    }).catch(function(){
      wait.remove();
      state.hist[mode].pop(); persist();
      addMsg("err", "Tidak bisa terhubung ke internet. Periksa koneksimu lalu coba lagi.");
      q.value = text; grow();
    }).then(function(){
      busy = false; sendBtn.disabled = false; q.focus();
    });
  }

  $("f").addEventListener("submit", function(e){
    e.preventDefault();
    var text = q.value.trim();
    if (!text || busy) return;
    if (!state.key){ openSettings(); return; }
    q.value = ""; grow();
    send(text);
  });

  q.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover:hover)").matches){
      e.preventDefault(); $("f").requestSubmit();
    }
  });

  function openSettings(){
    $("key").value = state.key;
    $("model").value = state.model;
    $("web").checked = state.web;
    sheet.hidden = false;
    $("key").focus();
  }
  function closeSettings(){ sheet.hidden = true; }

  $("openSet").addEventListener("click", openSettings);
  $("closeSet").addEventListener("click", closeSettings);
  sheet.addEventListener("click", function(e){ if (e.target === sheet) closeSettings(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !sheet.hidden) closeSettings(); });

  $("saveSet").addEventListener("click", function(){
    state.key = $("key").value.trim();
    state.model = $("model").value.trim() || "gemini-3.5-flash-lite";
    state.web = $("web").checked;
    save("fero_key", state.key); save("fero_model_v2", state.model); save("fero_web", state.web ? "1" : "0");
    closeSettings();
  });

  var wipeArmed = false;
  $("wipe").addEventListener("click", function(){
    var b = $("wipe");
    if (!wipeArmed){ wipeArmed = true; b.textContent = "Tekan lagi untuk menghapus"; setTimeout(function(){ wipeArmed = false; b.textContent = "Hapus semua riwayat chat"; }, 3000); return; }
    Object.keys(MODES).forEach(function(m){ state.hist[m] = []; });
    persist(); wipeArmed = false; b.textContent = "Hapus semua riwayat chat"; closeSettings(); draw();
  });

  $("newChat").addEventListener("click", function(){
    if (busy) return;
    state.hist[state.mode] = []; persist(); draw();
  });

  draw();
  if (!state.key) openSettings();

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
